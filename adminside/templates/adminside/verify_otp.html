<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #dceeff, #74b9ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .otp-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 30px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .otp-box h4 {
            font-weight: bold;
            margin-bottom: 15px;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-primary {
            border-radius: 10px;
            width: 100%;
            background-color: #0984e3;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0077cc;
        }
    </style>
</head>
<body>
    <div class="otp-box">
        <div class="text-secondary">
            {% if messages %}
               {% for message in messages %}
                   {{message}}
               {% endfor %}
            {% endif %}
        </div>
        <h4>OTP Verification</h4>
        <p>Please enter the OTP sent to your email.</p>
        <form method="POST" action="{% url 'adminside:verify_otp' %}">
            {% csrf_token %}
             <input type="hidden" name="email" value="{{ email }}">
            <div class="mb-3 text-start">
                <label for="otp" class="form-label">Enter OTP</label>
                <input type="text" class="form-control" name="otp" id="otp" placeholder="6-digit code" required>
            </div>
            <button type="submit" class="btn btn-primary mt-2">Verify OTP</button>
        </form>
    </div>
</body>
</html>
