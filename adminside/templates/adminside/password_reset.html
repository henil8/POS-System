{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #dfe9f3, #blue);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            color: #000;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 15px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background-color: #2575fc;
            border: none;
            font-weight: 600;
            font-size: 16px;
        }

        .btn-primary:hover {
            background-color: #1a5cd7;
        }

        h4 {
            font-weight: 700;
            text-align: center;
        }

        .text-muted {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="text-danger">
            {% if messages %}
               {% for message in messages %}
                   {{message}}
               {% endfor %}
            {% endif %}
        </div>
        <h4>Forgot Password</h4>
        <p class="text-muted">Enter your email to receive an OTP.</p>
        <form method="post" action="{% url 'adminside:send_otp' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn btn-primary">Send OTP</button>
        </form>
    </div>
</body>
</html>
