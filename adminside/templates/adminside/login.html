{% load static %}{% block title %}
<title>Login</title>
{% endblock %} {% block css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

{% endblock %}

<div class="container mt-5" style="max-width: 400px; margin: 0 auto;">
    <h2 class="text-center">Login</h2>
    <form method="post" action="{% url 'adminside:login' %}" autocomplete="off">
        {% csrf_token %}
          {% if form.non_field_errors %}
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            
            {% for error in form.non_field_errors %}
                {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                
             {% endfor %}
          </div>
          {% endif %}
        <div class="mb-3">
            <label for="{{ form.username.id_for_label }}">Username:</label>
            <input type="text" name="username" class="form-control"
                value="{{ form.username.value|default_if_none:'' }}" autocomplete="off">
            <span class="text-danger">{{ form.username.errors }}</span>  <!-- FIXED -->
        </div>
        
        <div class="mb-3">
            <label for="{{ form.password.id_for_label }}">Password:</label>
            <input type="password" name="password" class="form-control"
                autocomplete="new-password">
            <span class="text-danger">{{ form.password.errors }}</span>  <!-- FIXED -->
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <a href="#"><p>forgot password?</p> </a>    
</div>

<!-- Bootstrap JS (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
