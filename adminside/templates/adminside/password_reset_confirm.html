<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #e0f7fa, #80d8ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .reset-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .reset-box h4 {
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            border-radius: 12px;
        }

        .btn-reset {
            width: 100%;
            border-radius: 12px;
            background-color: #0077cc;
            color: #fff;
            font-weight: 600;
            border: none;
        }

        .btn-reset:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>
    <div class="reset-box">
        <div class="text-danger">
            {% if messages %}
               {% for message in messages %}
                   {{message}}
               {% endfor %}
            {% endif %}
        </div>
        <h4>Reset Your Password</h4>
        <!-- <p><strong>Testing: Email passed to this page → {{ email }}</strong></p> -->
        <form method="POST" action="{% url 'adminside:password_reset_confirm' %}">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <div class="mb-3 text-start">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="new_password" name="new_password" required>
            </div>
            <div class="mb-3 text-start">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-reset mt-2">Change Password</button>
        </form>
    </div>
</body>
</html>
