<h3>Payment for Table {{ data.table_no }}</h3>

<ul class="list-group">
  {% for order in data.orders %}
    <li class="list-group-item d-flex justify-content-between">
      {{ order.item_name }} x{{ order.quantity }}
      <span>₹{{ order.price }}</span>
    </li>
  {% endfor %}
</ul>

<p class="mt-3"><strong>Total: ₹{{data.total_price}}</strong></p>

<form method="post" action="{% url 'staffside:payment_method' %}">
    {% csrf_token %}
    <input type="hidden" value="{{data.total_price}}" name="total_price">
    <input type="hidden" name="table_no" value="{{ data.table_no }}">
    <button class="btn btn-success mt-3">Choose Payment Method</button>
    <a href="{% url 'staffside:pos' %}?table_no={{ data.table_no }}" class="btn btn-danger mt-3">Cancel</a>
</form>
