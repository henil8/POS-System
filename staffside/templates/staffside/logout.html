{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .logout-card {
      background-color: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
      margin: auto;
    }
    .logout-icon {
      font-size: 3rem;
      color: #dc3545;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="logout-card">
      <div class="logout-icon">
        <i class="fas fa-sign-out-alt"></i>
      </div>
      <h3 class="mb-3">Confirm Logout</h3>
      <p class="text-muted">Are you sure you want to end your session?</p>
      <button class="btn btn-danger mt-3" data-bs-toggle="modal" data-bs-target="#logoutModal">
        <i class="fas fa-power-off me-1"></i> Logout
      </button>
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="logoutModalLabel"><i class="fas fa-sign-out-alt me-2"></i>Confirm Logout</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <p>Are you sure you want to logout?</p>
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <a href="{% url 'staffside:logoutuser' %}" class="btn btn-danger">Logout</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
